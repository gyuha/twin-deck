[package]
name = "twin-deck-desktop"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde.workspace = true
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
td-archive = { path = "../../../crates/td-archive" }
td-search = { path = "../../../crates/td-search" }
td-vfs = { path = "../../../crates/td-vfs" }
td-config = { path = "../../../crates/td-config" }
td-launch = { path = "../../../crates/td-launch" }
td-ops = { path = "../../../crates/td-ops" }
td-queue = { path = "../../../crates/td-queue" }
td-state = { path = "../../../crates/td-state" }
td-volumes = { path = "../../../crates/td-volumes" }
td-watch = { path = "../../../crates/td-watch" }
clipboard-rs = "0.3.5"
drag = "2.1.1"
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
