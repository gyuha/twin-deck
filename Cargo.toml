[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/td-vfs", "crates/td-volumes", "crates/td-config", "crates/td-launch", "crates/td-ops", "crates/td-queue", "crates/td-watch"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "UNLICENSED"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
