[package]
name = "td-remote"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# 가짜 FTP·SFTP 서버(`td_remote::testing`)를 노출한다. 다른 크레이트의 테스트에서 켠다.
testing = ["dep:tempfile"]

[dependencies]
thiserror.workspace = true
td-terminal = { path = "../td-terminal" }
suppaftp = "12"
russh = "0.63"
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
tempfile = { workspace = true, optional = true }
anyhow = "1"
rand = "0.10"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
td-remote = { path = ".", features = ["testing"] }
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
