version: "3"

# justfile과 같은 작업을 go-task로 실행한다. `task --list`로 목록을 본다.
tasks:
  setup:
    desc: JS 의존성 설치와 Rust 툴체인 확인
    cmds:
      - bun install
      - rustup show

  dev:
    desc: Tauri 개발 모드 실행 (Vite + Rust)
    cmds:
      - bun run --cwd apps/desktop tauri dev

  gen-types:
    desc: Rust 타입에서 TS 바인딩(bindings.ts)과 기본 설정 fixture 재생성
    cmds:
      - cargo test -p twin-deck-desktop up_to_date
    env:
      UPDATE_BINDINGS: "1"

  test:
    desc: Rust와 TS 테스트 전체 실행
    cmds:
      - cargo test --workspace
      - bun run test

  check:
    desc: fmt 검사, clippy, TS 타입 검사
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - bun run typecheck

  fmt:
    desc: Rust 포맷
    cmds:
      - cargo fmt --all

  build:
    desc: 프런트엔드 빌드 후 릴리스 빌드 (현재 OS)
    cmds:
      - bun run build
      - cargo build --workspace --release

  bundle:
    desc: 현재 OS용 설치 파일 만들기 (macOS는 .app, Windows는 NSIS 설치 파일) → target/release/bundle
    cmds:
      - task: bundle:mac
      - task: bundle:win

  bundle:mac:
    internal: true
    platforms: [darwin]
    cmds:
      - bun run --cwd apps/desktop tauri build --bundles app

  bundle:win:
    internal: true
    platforms: [windows]
    cmds:
      - bun run --cwd apps/desktop tauri build --bundles nsis

  install:
    desc: 설치 파일을 만들어 이 PC에 설치 (macOS는 /Applications, Windows는 NSIS 조용히 설치)
    cmds:
      - task: bundle
      - task: install:mac
      - task: install:win

  install:mac:
    internal: true
    platforms: [darwin]
    cmds:
      - scripts/install.sh install

  install:win:
    internal: true
    platforms: [windows]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 install

  uninstall:
    desc: 설치한 앱 삭제 (설정은 남김)
    cmds:
      - task: uninstall:mac
      - task: uninstall:win

  uninstall:mac:
    internal: true
    platforms: [darwin]
    cmds:
      - scripts/install.sh uninstall

  uninstall:win:
    internal: true
    platforms: [windows]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 uninstall

  release:
    desc: 현재 OS용 설치 파일을 GitHub 릴리스(v<버전>)에 올림 (macOS와 Windows에서 각각 실행하면 같은 릴리스에 모인다)
    prompt: GitHub에 릴리스를 올립니다. 계속할까요?
    cmds:
      - task: bundle
      - task: release:mac
      - task: release:win

  release:mac:
    internal: true
    platforms: [darwin]
    cmds:
      - scripts/release.sh

  release:win:
    internal: true
    platforms: [windows]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1
