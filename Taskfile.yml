version: "3"

# justfile과 같은 작업을 go-task로 실행한다. `task --list`로 목록을 본다.
tasks:
  setup:
    desc: JS 의존성 설치와 Rust 툴체인 확인
    cmds:
      - bun install
      - rustup show

  dev:
    desc: Tauri 개발 모드 실행 (Vite + Rust)
    cmds:
      - bun run --cwd apps/desktop tauri dev

  gen-types:
    desc: Rust 타입에서 TS 바인딩(bindings.ts)과 기본 설정 fixture 재생성
    cmds:
      - cargo test -p twin-deck-desktop up_to_date
    env:
      UPDATE_BINDINGS: "1"

  test:
    desc: Rust와 TS 테스트 전체 실행
    cmds:
      - cargo test --workspace
      - bun run test

  check:
    desc: fmt 검사, clippy, TS 타입 검사
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - bun run typecheck

  fmt:
    desc: Rust 포맷
    cmds:
      - cargo fmt --all

  build:
    desc: 프런트엔드 빌드 후 릴리스 빌드 (현재 OS)
    cmds:
      - bun run build
      - cargo build --workspace --release
