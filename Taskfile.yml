version: "3"

# justfile과 같은 작업을 go-task로 실행한다. `task --list`로 목록을 본다.
tasks:
  setup:
    desc: JS 의존성 설치와 Rust 툴체인 확인
    cmds:
      - bun install
      - rustup show

  dev:
    desc: Tauri 개발 모드 실행 (Vite + Rust)
    cmds:
      - bun run --cwd apps/desktop tauri dev

  icons:
    desc: 선택 원본에서 데스크톱 앱 아이콘 재생성 (macOS)
    platforms: [darwin]
    cmds:
      - swift scripts/generate-icons.swift

  gen-types:
    desc: Rust 타입에서 TS 바인딩(bindings.ts)과 기본 설정 fixture 재생성, 테마 YAML에서 색 표(themes.generated.ts)·이름 목록(themes.rs) 재생성
    cmds:
      - node scripts/gen-themes.mjs
      - cargo test -p twin-deck-desktop up_to_date
    env:
      UPDATE_BINDINGS: "1"

  test:
    desc: Rust와 TS 테스트 전체 실행
    cmds:
      - cargo test --workspace
      - bun run test

  check:
    desc: fmt 검사, clippy, TS 타입 검사
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - bun run typecheck

  fmt:
    desc: Rust 포맷
    cmds:
      - cargo fmt --all

  build:
    desc: 프런트엔드 빌드 후 릴리스 빌드 (현재 OS)
    cmds:
      - bun run build
      - cargo build --workspace --release

  bundle:
    desc: 현재 OS용 설치 파일 만들기 (macOS는 .app, Windows는 NSIS 설치 파일) → target/release/bundle
    cmds:
      - task: bundle:mac
      - task: bundle:win

  bundle:mac:
    internal: true
    platforms: [darwin]
    cmds:
      - bun run --cwd apps/desktop tauri build --bundles app

  bundle:win:
    internal: true
    platforms: [windows]
    cmds:
      - bun run --cwd apps/desktop tauri build --bundles nsis

  install:
    desc: 설치 파일을 만들어 이 PC에 설치 (macOS는 /Applications, Windows는 NSIS 조용히 설치)
    cmds:
      - task: bundle
      - task: install:mac
      - task: install:win

  install:mac:
    internal: true
    platforms: [darwin]
    cmds:
      - scripts/install.sh install

  install:win:
    internal: true
    platforms: [windows]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 install

  uninstall:
    desc: 설치한 앱 삭제 (설정은 남김)
    cmds:
      - task: uninstall:mac
      - task: uninstall:win

  uninstall:mac:
    internal: true
    platforms: [darwin]
    cmds:
      - scripts/install.sh uninstall

  uninstall:win:
    internal: true
    platforms: [windows]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 uninstall

  # 릴리스용 번들: 업데이트 산출물(.app.tar.gz/.sig 등)까지 만든다. 서명 키가 필요하다 —
  # TAURI_SIGNING_PRIVATE_KEY 환경변수(키 파일 경로 또는 내용). 평소 task bundle은 키 없이 된다.
  bundle:release:
    internal: true
    cmds:
      - task: bundle:release:mac
      - task: bundle:release:win

  bundle:release:mac:
    internal: true
    platforms: [darwin]
    cmds:
      - bun run --cwd apps/desktop tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":true}}'

  bundle:release:win:
    internal: true
    platforms: [windows]
    cmds:
      - bun run --cwd apps/desktop tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'

  deploy:
    desc: "[Actions 배포] 사전 점검 뒤 GitHub Actions의 release 워크플로를 시작한다. 두 OS 빌드·초안 업로드 후 승인하면 공개하고 Homebrew tap까지 갱신한다"
    prompt: "[Actions 배포] GitHub Actions가 macOS와 Windows를 빌드해 초안에 올립니다. 이어서 Environment release에서 승인하면 공개(되돌릴 수 없음)하고 Homebrew tap을 갱신합니다. 계속할까요?"
    cmds:
      - |
        set -e
        fail() { echo "배포를 시작하지 않았습니다: $1" >&2; exit 1; }
        [ "$(git branch --show-current)" = "main" ] || fail "main 브랜치가 아닙니다"
        [ -z "$(git status --porcelain)" ] || fail "커밋하지 않은 변경이 있습니다"
        git fetch -q origin main
        [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || fail "origin/main과 다릅니다 (push 또는 pull 먼저)"
        node scripts/release-notes.mjs --check || fail "CHANGELOG.md에 이 버전의 항목이 없습니다"
        VERSION="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' apps/desktop/src-tauri/tauri.conf.json | head -1)"
        PUBLISHED="$(gh api "repos/{owner}/{repo}/releases?per_page=100" --jq "[.[] | select(.tag_name==\"v$VERSION\" and .draft==false)] | length")"
        [ "$PUBLISHED" = "0" ] || fail "v$VERSION은 이미 공개된 릴리스입니다. 버전을 올리세요"
        REVIEWERS="$(gh api "repos/{owner}/{repo}/environments/release" --jq '[.protection_rules[] | select(.type=="required_reviewers")] | length' 2>/dev/null || echo 0)"
        [ "$REVIEWERS" != "0" ] || fail "Environment release가 없거나 Required reviewers가 없습니다 (Settings → Environments). 없으면 승인 없이 공개됩니다"
        gh workflow run release.yml --ref main
        echo "release 워크플로를 시작했습니다 (v$VERSION). 진행: gh run watch"
        echo "두 OS 업로드가 끝나면 GitHub에서 release Environment 승인 요청이 옵니다. 승인하면 공개합니다"

  release:draft:
    desc: "[드래프트 배포] 이 OS의 파일을 비공개 초안(draft) 릴리스에 올린다. 공개하지 않고 태그도 만들지 않는다. macOS와 Windows에서 각각 실행하면 같은 초안에 모인다"
    prompt: "[드래프트 배포] 번들을 만들어 GitHub의 비공개 초안 릴리스에 올립니다. 공개되지 않고 태그도 만들어지지 않습니다. 계속할까요?"
    cmds:
      # 긴 빌드 전에 먼저: CHANGELOG.md에 이 버전의 변경 사항이 적혀 있어야 한다
      - node scripts/release-notes.mjs --check
      - task: bundle:release
      - task: release:mac
        vars: { MODE: draft }
      - task: release:win
        vars: { MODE: draft }

  release:
    desc: "[배포] 이 OS의 파일을 올린 뒤 릴리스를 공개한다(태그가 만들어진다). macOS용과 Windows용 파일이 초안에 모두 있어야 공개하고, 부족하면 공개하지 않고 안내한다(한쪽만이면 ALLOW_PARTIAL=1)"
    prompt: "[배포] 번들을 만들어 GitHub 릴리스에 올리고 공개합니다(태그가 만들어지고 누구나 받을 수 있게 됩니다). macOS와 Windows 파일이 모두 있을 때만 공개합니다. 계속할까요?"
    cmds:
      - node scripts/release-notes.mjs --check
      - task: bundle:release
      - task: release:mac
        vars: { MODE: publish }
      - task: release:win
        vars: { MODE: publish }

  release:mac:
    internal: true
    platforms: [darwin]
    cmds:
      - scripts/release.sh {{.MODE}}

  release:win:
    internal: true
    platforms: [windows]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 -Mode {{.MODE}}
